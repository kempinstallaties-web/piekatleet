<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PiekAtleet</title>
  <meta name="description" content="PiekAtleet — workout tracker">
  <meta name="theme-color" content="#0c0e11">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PiekAtleet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">PIEK-ATLEET</span>
      <span class="brand-v" id="brandV"></span>
    </div>
    <div id="syncStatus" class="sync sync-pending" role="status">
      <span class="sync-dot"></span><span id="syncText">laden…</span>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Hoofdnavigatie">
    <button class="tab" data-view="vandaag" aria-label="Vandaag">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 10v4M21 10v4M6.5 12h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Vandaag</span>
    </button>
    <button class="tab" data-view="week" aria-label="Week">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Week</span>
    </button>
    <button class="tab" data-view="historie" aria-label="Historie">
      <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      <span>Historie</span>
    </button>
    <button class="tab" data-view="ankers" aria-label="Ankers">
      <svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="20" cy="7" r="1.6" fill="currentColor"/></svg>
      <span>Ankers</span>
    </button>
    <button class="tab" data-view="info" aria-label="Info">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.4" fill="currentColor"/></svg>
      <span>Info</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="config.js"></script>
  <script src="program.js"></script>
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline-shell is optioneel */ });
      });
    }
  </script>
</body>
</html>
